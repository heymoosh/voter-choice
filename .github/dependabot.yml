# Dependency-update config for a Class C (user data / auth / trust) repo per
# docs/maintenance.md and the shared rubric at
# simple-kanban docs/maintenance-loops.md ("Dependency scan: weekly" row).
#
# This covers version-update PRs only. Security-alert-driven PRs
# ("Dependabot security updates") are a separate repo-settings toggle
# (Settings > Code security > Dependabot) — currently OFF; see docs/maintenance.md
# and the PR body for why this audit didn't flip it itself.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # eslint 10 + eslint-config-next 16 are coupled to a Next.js 16 upgrade.
      # config-next 15.x declares `eslint@^7||^8||^9` and its bundled
      # @rushstack/eslint-patch hard-fails under eslint 10 ("Failed to patch
      # ESLint … unsupported version"); config-next 16 requires Next 16, and
      # `next lint` itself is removed in Next 16 (the lint setup migrates to the
      # ESLint CLI). So both majors ride WITH the Next 16 migration, not as
      # standalone bumps. Minor/patch updates still flow. Remove these two rules
      # when Next is upgraded to 16. See the [P2] Dependabot-evaluation card.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # vitest 4 cluster — deferred. These are dev-only test tooling (never in
      # the shipped bundle; Next builds with turbopack, not vite), so the major
      # buys no runtime/product/security benefit — `npm audit --omit=dev`
      # already scopes the audit gate to prod deps. The upgrade is a real
      # migration: vitest 4 forbids `new` on arrow-function mock implementations
      # (breaks the AWS/Anthropic SDK mocks) and changes async module-resolution
      # timing (breaks the next/dynamic stub in page.test.tsx); and
      # @vitejs/plugin-react 6 forces vite 8 + a full lockfile regen. Not worth
      # the churn now — revisit deliberately, ideally with the Next 16 / vite
      # work. Minor/patch (incl. security) still flow within the current major.
      # See the [P2] Dependabot-evaluation card.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
