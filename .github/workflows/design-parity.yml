name: Design Review

# Design-review CI for the Keystone/redesign surfaces. The pixel parity-gate
# VERDICT (scripts/design/parity-gate.ts) was RETIRED — it anchored the app to
# a frozen point-in-time snapshot (.keystone-canvas-refs/), so it failed on
# every intended design change and went stale on every redesign (it was red on
# main itself). See the [P2] "Evaluate removing the parity-gate" card in
# docs/operations/voter-choice-backlog.md for the full rationale.
#
# What remains is the signal that actually caught bugs: review-gallery
# regenerates the before/after screenshot artifact per PR
# (scripts/design/review-gallery.ts) and posts one PR comment linking it, so a
# human — or the pipeline's self-vet agent — can eyeball the real render. The
# "did the design we asked for get built?" check rides on that self-vet (the
# agent already reads these screenshots), NOT on a metered per-PR API call.
#
# This is not a required status check. It always fires on PRs but self-skips via
# the paths-filter when nothing design-scoped changed; pushes to main run it
# unfiltered so main's design state stays visible in Actions history.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-gallery:
    runs-on: ubuntu-latest
    # Dev-server boot + chromium launch + ~27 scenario captures. Observed
    # ~4-6 min locally; 20 min leaves headroom for a cold CI runner without
    # letting a genuine hang eat the 360-min job default.
    timeout-minutes: 20
    permissions:
      contents: read
      # Update/create the one PR comment below (Issues API — PRs are issues
      # under the hood; pull-requests: write is the scoped grant for that).
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # review-gallery.ts diffs against --base (default origin/main) to
          # badge each scenario "changed since base"; a shallow checkout has no
          # local origin/main to resolve against.
          fetch-depth: 0

      - name: Detect design-scoped path changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            scoped:
              - 'src/prototype/redesign/**'
              - 'src/prototype/VoterChoiceApp.tsx'
              - 'src/app/page.tsx'
              - 'public/*.css'
              - 'design-handoff/keystone-canvas/**'
              - 'design-handoff/design-session/**'
              - '.keystone-canvas-refs/**'
              - 'scripts/design/**'
              - 'e2e/helpers/redesign-mocks.ts'
              - '.github/workflows/design-parity.yml'

      - name: Note skip when no design-scoped changes
        if: github.event_name == 'pull_request' && steps.filter.outputs.scoped == 'false'
        run: echo "::notice::No design-scoped paths changed in this PR; review-gallery skipped."

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npx playwright install --with-deps chromium

      # Default --ref HEAD resolves to this checkout's own commit, so
      # resolveAppInstance (capture-shared.ts) runs the current worktree
      # directly instead of checking out a second temp worktree.
      - name: Regenerate design review artifact
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npm run design:review-gallery

      - name: Upload review artifact
        if: always() && (github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keystone-design-review
          path: docs/design-review/
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true

      - name: Comment on PR with review artifact link
        if: github.event_name == 'pull_request' && steps.filter.outputs.scoped == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = "<!-- keystone-design-review-bot -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `**Keystone design review** — before/after screenshots for every changed surface.`,
              "",
              `Download the \`keystone-design-review\` artifact from [this workflow run](${runUrl}) (bottom of the Summary page, under Artifacts) and eyeball the real render.`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
