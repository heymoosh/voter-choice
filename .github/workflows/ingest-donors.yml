name: Ingest Donor Data

on:
  # Sunday 08:30 UTC — after federal (07:00) and state (07:30) vote ingests,
  # before the bill tagger (09:00). Donors are independent of bills.
  schedule:
    - cron: "30 8 * * 0"
  # Allow manual trigger for testing / backfill
  workflow_dispatch:
    inputs:
      federal_only:
        description: "Run ONLY the federal (FEC) donor ingest; skip the state FollowTheMoney + Nebraska steps. Use for a fast, free-tier-safe federal backfill that avoids the known state-data issues."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Bitwarden Secrets Manager CLI
        # Pinned to bws-v2.0.0's published checksum:
        # https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-sha256-checksums-2.0.0.txt
        # On a deliberate version bump, update both the download URL and this hash together.
        run: |
          curl -sSLo bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-x86_64-unknown-linux-musl-2.0.0.zip"
          echo "ea6eb18f1270388f12d15a35f919ccb3488d32a777433baefe883d561f46fc73  bws.zip" | sha256sum -c -
          unzip -o bws.zip bws
          sudo install -m 755 bws /usr/local/bin/bws
          bws --version

      - name: Pull secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: |
          # ---------------------------------------------------------------
          # DATABASE_URL — Neon Postgres connection string
          # UUID: 90abeeed-130e-4707-86ff-b446003770c2
          # ---------------------------------------------------------------
          DATABASE_URL=$(bws secret get 90abeeed-130e-4707-86ff-b446003770c2 --access-token "$BWS_ACCESS_TOKEN" --output json | jq -r '.value')
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "::add-mask::$DATABASE_URL"

          # ---------------------------------------------------------------
          # FEC_API_KEY — optional; public tier works without it.
          # UUID: 17e983ad-82bd-45fe-8499-b446003890ac
          # Higher rate limits when present (> 1k req/hr).
          # ---------------------------------------------------------------
          FEC_API_KEY=$(bws secret get 17e983ad-82bd-45fe-8499-b446003890ac --access-token "$BWS_ACCESS_TOKEN" --output json | jq -r '.value')
          echo "FEC_API_KEY=$FEC_API_KEY" >> "$GITHUB_ENV"
          echo "::add-mask::$FEC_API_KEY"

          # ---------------------------------------------------------------
          # FOLLOWTHEMONEY_API_KEY — optional enrichment for state donor data.
          # NOTE: FollowTheMoney.org API is now commercial (Open Secrets).
          # All 50 states already have donor data from dedicated scraper scripts.
          # FTM would provide additional industry-level enrichment only.
          # Skip if not provisioned — state_donors.ts handles missing key gracefully.
          set +e
          FTM_SECRET=$(bws secret get <FOLLOWTHEMONEY_API_KEY_BWS_SECRET_ID> --access-token "$BWS_ACCESS_TOKEN" --output json 2>/dev/null)
          FTM_STATUS=$?
          set -e
          if [ "$FTM_STATUS" -eq 0 ]; then
            FOLLOWTHEMONEY_API_KEY=$(echo "$FTM_SECRET" | jq -r '.value // empty')
            if [ -n "$FOLLOWTHEMONEY_API_KEY" ]; then
              echo "FOLLOWTHEMONEY_API_KEY=$FOLLOWTHEMONEY_API_KEY" >> "$GITHUB_ENV"
              echo "::add-mask::$FOLLOWTHEMONEY_API_KEY"
            fi
          fi
          # ---------------------------------------------------------------

          # ---------------------------------------------------------------
          # INGEST_FAILURE_WEBHOOK_URL — optional; webhook for ingest failure alerts.
          # UUID: <INGEST_FAILURE_WEBHOOK_BWS_SECRET_ID>
          # Replace the placeholder with the real BWS secret UUID once provisioned.
          # ---------------------------------------------------------------
          set +e
          WEBHOOK_SECRET=$(bws secret get <INGEST_FAILURE_WEBHOOK_BWS_SECRET_ID> --access-token "$BWS_ACCESS_TOKEN" --output json 2>/dev/null)
          WEBHOOK_STATUS=$?
          set -e
          if [ "$WEBHOOK_STATUS" -eq 0 ]; then
            INGEST_FAILURE_WEBHOOK_URL=$(echo "$WEBHOOK_SECRET" | jq -r '.value // empty')
            if [ -n "$INGEST_FAILURE_WEBHOOK_URL" ]; then
              echo "INGEST_FAILURE_WEBHOOK_URL=$INGEST_FAILURE_WEBHOOK_URL" >> "$GITHUB_ENV"
              echo "::add-mask::$INGEST_FAILURE_WEBHOOK_URL"
            fi
          fi

      - name: Run federal donor ingest (Phase E)
        run: npx tsx scripts/ingest/federal-donors.ts

      - name: Run state donor ingest via FTM API (Phase E)
        # Skipped when federal_only=true (manual federal backfill). The state
        # FollowTheMoney ingest is optional enrichment and has known data-quality
        # issues to resolve separately; the federal (FEC) ingest above is what
        # candidate-card donor coalitions need for federal races.
        # --skip-existing: preserves higher-quality bulk data for states that already
        # have custom scrapers (CA, TX, WA, etc.) and only fills the remaining states.
        if: ${{ github.event.inputs.federal_only != 'true' }}
        run: npx tsx scripts/ingest/state-donors.ts --skip-existing

      - name: Run Nebraska NADC donor ingest (Phase E)
        if: ${{ github.event.inputs.federal_only != 'true' }}
        run: npx tsx scripts/ingest/ne-nadc-donors.ts

      - name: Notify on ingest failure
        if: failure()
        env:
          WEBHOOK: ${{ env.INGEST_FAILURE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "INGEST_FAILURE_WEBHOOK_URL not set — skipping alert"
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg job "${{ github.job }}" --arg run "${{ github.run_id }}" --arg repo "${{ github.repository }}" \
              '{text: "[voter-choice ingest failure] job=\($job) repo=\($repo) run_id=\($run)"}')"
