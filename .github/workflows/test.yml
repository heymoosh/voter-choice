name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # The REQUIRED e2e check covers the prod default: the congress-assessment
  # experience (flag unset). The parked legacy ballot experience keeps its own
  # non-required leg below.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Flag unset → the congress-assessment experience builds as default.
      - name: Build (congress-assessment experience)
        run: npm run build

      - name: Run Playwright e2e tests (redesign suite)
        run: npm run e2e

  # The parked legacy ballot experience (src/prototype/VoterChoiceApp.tsx,
  # behind NEXT_PUBLIC_BALLOT_ENABLED=true — Phase-3 reuse). Not a required
  # check, but keeps the parked code exercised so it doesn't rot.
  e2e-ballot-legacy:
    runs-on: ubuntu-latest
    # Build-time inlined: the whole job (build + specs) runs the legacy flavor.
    env:
      NEXT_PUBLIC_BALLOT_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (legacy ballot experience)
        run: npm run build

      - name: Run Playwright e2e tests (legacy ballot suite)
        run: npm run e2e
