name: Test

on:
  pull_request:
    branches:
      - launch/production
  push:
    branches:
      - launch/production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # The app IS the prototype (src/prototype/VoterChoiceApp.tsx, rendered by
      # src/app/page.tsx). These specs drive that shipped app with mocked data
      # seams. The old legacy specs (old UI) and the abandoned re-port specs
      # (PageContent/BallotToolClient, behind PROMPT_FLEET_V2) were removed —
      # they tested code no route renders. The flag no longer gates any UI.
      - name: Run Playwright e2e tests (prototype suite)
        run: npm run e2e
