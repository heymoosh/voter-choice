name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next.config.ts sets typescript.ignoreBuildErrors (build skips tsc),
      # so this step is the only CI typecheck gate.
      - name: Typecheck
        run: npm run typecheck

      # scripts/design/capture-shared.test.ts launches a real headless
      # browser (not jsdom) to regression-test the scroll-trap capture fix,
      # so the unit-test step needs Chromium installed too.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test

      # Duplication ratchet (scripts/quality/duplication-gate.ts): fails when
      # a change introduces NEW copy-paste duplication (a file pair jscpd
      # finds clones in that isn't in the committed baseline, or a baselined
      # pair that grew). Pre-existing duplication is grandfathered in
      # scripts/quality/duplication-baseline.json; intentional new duplication
      # requires `npm run dup:baseline` + justifying the baseline diff in the
      # PR. Takes ~5s, needs only node_modules — no build, browser, or DB.
      - name: Component duplication gate
        run: npm run dup:check

      # Component-minimization gate (scripts/quality/component-inventory-gate.ts):
      # a new component file under src/prototype/redesign/ fails CI until it
      # has an inventory entry stating what UI function it serves and why an
      # existing component couldn't. Complements dup:check (literal clones)
      # with the same-function-different-code case; the advisory AI overlap
      # review (component-review.yml) reads the same inventory.
      - name: Component inventory gate
        run: npm run inventory:check

      - name: Build
        run: npm run build

  # The REQUIRED e2e check covers the prod default: the congress-assessment
  # experience (flag unset). The job ALWAYS fires on PRs so it can stay a
  # required status check without deadlocking docs-only PRs — the actual
  # Playwright run is gated by a paths-filter step inside the job (same
  # pattern as mutation.yml). Pushes to main always run the full leg.
  #
  # The parked legacy ballot experience runs nightly in
  # .github/workflows/e2e-legacy-nightly.yml.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Detect e2e-relevant changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            scoped:
              - 'src/**'
              - 'e2e/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.ts'
              - 'playwright.config.ts'
              - 'tsconfig.json'
              - 'scripts/generate-ballot-prompt-module.mjs'
              - '.github/workflows/test.yml'

      - name: Note skip when no e2e-relevant changes
        if: github.event_name == 'pull_request' && steps.filter.outputs.scoped == 'false'
        run: |
          echo "::notice::No e2e-relevant paths changed in this PR; Playwright skipped. e2e gate reports passed."

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npx playwright install --with-deps chromium

      # Flag unset → the congress-assessment experience builds as default.
      - name: Build (congress-assessment experience)
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npm run build

      - name: Run Playwright e2e tests (redesign suite)
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npm run e2e
