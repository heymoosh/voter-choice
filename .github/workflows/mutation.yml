name: Mutation

# Stryker mutation testing on the high-stakes paths only. Workflow ALWAYS
# fires on PRs to main so the `mutation` job can be a required
# status check without deadlocking docs-only PRs. The actual Stryker run is
# gated by a paths-filter step inside the job — Stryker runs when scoped
# paths change, otherwise the job exits 0 with a "skipped" notice.
#
# Cron (nightly) and workflow_dispatch always run full Stryker — both are
# explicit signals to do the heavy work.
#
# PR filter vs nightly scope: the PR-time paths filter below covers only
# LOGIC paths — pure-template prompt files (string-template exports under
# src/lib/prompts/ with no branching) are deliberately excluded so
# prompt-copy-only PRs skip the ~45-min Stryker run. stryker.config.json's
# `mutate` array still includes ALL prompt files, so the nightly/dispatch
# runs keep full coverage; template drift is caught that night instead of
# at PR time. When adding a prompt file with real logic (parsing,
# branching), add it AND its test here as well as to the mutate array.

on:
  pull_request:
    branches:
      - main
  schedule:
    # Nightly at 04:00 UTC — low-traffic window; surfaces drift even when
    # no scoped-path PRs are open.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Stryker's scoped run takes ~45 min, so a 45-min cap left zero headroom —
    # any run that ran a hair long was cancelled at the wall, turning the
    # required `mutation` check red and jamming auto-merge. 60 gives margin.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect scoped path changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scoped:
              - 'src/lib/server/budget.ts'
              - 'src/lib/server/rate-limit.ts'
              - 'src/lib/generatePrompt.ts'
              - 'src/lib/getStateData.ts'
              - 'src/lib/server/alignment.ts'
              - 'src/lib/prompts/router.ts'
              - 'src/lib/prompts/router.test.ts'
              - 'src/lib/prompts/pii-strip.ts'
              - 'src/lib/prompts/pii-strip.test.ts'
              - 'src/lib/prompts/parse-theme-amendment.ts'
              - 'src/lib/prompts/parse-theme-amendment.test.ts'
              - 'src/lib/prompts/parse-theme-extraction.ts'
              - 'src/lib/prompts/parse-theme-extraction.test.ts'
              - 'src/lib/prompts/__tests__/**'
              - 'src/lib/state-rules/**'
              - 'src/lib/anthropic-client-byok.ts'
              - 'src/lib/server/budget.test.ts'
              - 'src/lib/server/rate-limit.test.ts'
              - 'src/lib/generatePrompt.test.ts'
              - 'src/lib/getStateData.test.ts'
              - 'src/lib/server/alignment.test.ts'
              - 'stryker.config.json'
              - 'tsconfig.stryker.json'
              - '.github/workflows/mutation.yml'

      - name: Note skip when no scoped changes
        if: github.event_name == 'pull_request' && steps.filter.outputs.scoped == 'false'
        run: |
          echo "::notice::No scoped paths changed in this PR; Stryker skipped. Mutation gate reports passed."
          echo "PR filter covers logic paths only (see header comment); nightly runs mutate the full stryker.config.json scope."

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npm ci

      - name: Sync generated ballot prompt module
        # Stryker spawns Vitest programmatically and bypasses npm pre/post
        # hooks, so the `pretest` hook (which generates the ballot prompt
        # module imported by scoped tests) does not fire automatically.
        # Run it explicitly to avoid spurious import failures.
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npm run sync:ballot-prompt

      - name: Run Stryker mutation testing
        if: github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true'
        run: npx stryker run

      - name: Upload mutation report
        # Always upload — even on failure — so reviewers can inspect the
        # HTML report when the threshold gate trips. Only upload when
        # Stryker actually ran (i.e., not on a skipped PR).
        if: always() && (github.event_name != 'pull_request' || steps.filter.outputs.scoped == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn
