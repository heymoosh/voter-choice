name: Mutation

# Stryker mutation testing on the high-stakes paths only. Workflow ALWAYS
# fires on PRs to main so the `mutation` job can be a required
# status check without deadlocking docs-only PRs. The actual Stryker run is
# gated by a paths-filter step inside the job — Stryker runs when scoped
# paths change, otherwise the job exits 0 with a "skipped" notice.
#
# Cron (nightly) and workflow_dispatch always run full Stryker — both are
# explicit signals to do the heavy work.
#
# PR filter vs nightly scope: the PR-time paths filter below covers only
# LOGIC paths — pure-template prompt files (string-template exports under
# src/lib/prompts/ with no branching) are deliberately excluded so
# prompt-copy-only PRs skip the ~45-min Stryker run. stryker.config.json's
# `mutate` array still includes ALL prompt files, so the nightly/dispatch
# runs keep full coverage; template drift is caught that night instead of
# at PR time. When adding a prompt file with real logic (parsing,
# branching), add it AND its test here as well as to the mutate array.
#
# TWO layers of narrowing, not one. The paths filter decides WHETHER Stryker
# runs; the "Narrow the PR run" step decides WHAT it mutates. A PR touching one
# scoped file used to re-mutate the entire ~8,300-line mutate array (~85 min,
# nearly all of it code the PR never touched) — now it mutates only its own
# changed sources. Full scope is preserved on nightly/dispatch and whenever the
# scope definition itself changes.

on:
  pull_request:
    branches:
      - main
  schedule:
    # Nightly at 04:00 UTC — low-traffic window; surfaces drift even when
    # no scoped-path PRs are open.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Stryker's scoped run has grown with the mutate scope: ~45 min when the
    # 45-min cap was first raised to 60, but by 2026-07 the full prompt-fleet
    # scope reached ~85 min (a run stalled at 67% when the 60-min wall killed
    # it, turning the required `mutation` check red and jamming auto-merge —
    # the same failure mode 45→60 was meant to fix). 120 restores real margin
    # over the current ~85-min run. Revisit (scope trim or concurrency) if it
    # keeps climbing.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect scoped path changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # `shell` emits the matched paths as a space-separated, shell-quoted
          # list on `scoped_files`, which the next step turns into Stryker's
          # --mutate argument. Without it we only learn THAT something in scope
          # changed, not what — and every PR touching one file re-mutates all
          # ~8,300 lines of the mutate array.
          list-files: shell
          filters: |
            scoped:
              - 'src/lib/server/budget.ts'
              - 'src/lib/server/rate-limit.ts'
              - 'src/lib/generatePrompt.ts'
              - 'src/lib/getStateData.ts'
              - 'src/lib/server/alignment.ts'
              - 'src/lib/prompts/router.ts'
              - 'src/lib/prompts/router.test.ts'
              - 'src/lib/prompts/pii-strip.ts'
              - 'src/lib/prompts/pii-strip.test.ts'
              - 'src/lib/prompts/parse-theme-amendment.ts'
              - 'src/lib/prompts/parse-theme-amendment.test.ts'
              - 'src/lib/prompts/parse-theme-extraction.ts'
              - 'src/lib/prompts/parse-theme-extraction.test.ts'
              - 'src/lib/prompts/__tests__/**'
              - 'src/lib/state-rules/**'
              - 'src/lib/anthropic-client-byok.ts'
              - 'src/lib/server/budget.test.ts'
              - 'src/lib/server/rate-limit.test.ts'
              - 'src/lib/generatePrompt.test.ts'
              - 'src/lib/getStateData.test.ts'
              - 'src/lib/server/alignment.test.ts'
              - 'stryker.config.json'
              - 'tsconfig.stryker.json'
              - '.github/workflows/mutation.yml'

      - name: Decide whether to run Stryker
        id: decide
        # Single source of truth for every downstream step's condition, so
        # the run-gate and its "Note skip" negation can never drift apart.
        # A version-pin bump inside this file (Dependabot's github_actions
        # ecosystem) trips the '.github/workflows/mutation.yml' scoped-path
        # filter above but cannot change what a mutant does — exclude that
        # actor. A human editing this workflow still gets full PR-time
        # coverage. Non-PR events (nightly cron, workflow_dispatch) are an
        # explicit signal to always do the heavy work.
        run: |
          echo "should_run=${{ github.event_name != 'pull_request' || (steps.filter.outputs.scoped == 'true' && github.actor != 'dependabot[bot]') }}" >> "$GITHUB_OUTPUT"
          echo "event_name=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          echo "scoped=${{ steps.filter.outputs.scoped }}"

      - name: Narrow the PR run to the files this PR changed
        id: scope
        # A PR that touches ONE scoped file used to re-mutate the entire
        # ~8,300-line mutate array — ~85 minutes, of which the overwhelming
        # majority mutates code the PR never went near. Stryker's --mutate
        # overrides the config array, so PR runs pass only the changed source
        # files and the nightly/dispatch runs keep full coverage. What you
        # learn is unchanged; WHEN you learn about drift elsewhere moves from
        # merge time to that night.
        #
        # Mapping rules:
        #   • a changed source file mutates itself;
        #   • a changed `foo.test.ts` mutates its sibling `foo.ts`, since
        #     weakening a test is exactly what this gate exists to catch;
        #   • a test with no sibling source (the prompts/__tests__ golden
        #     files) contributes nothing on its own;
        #   • --mutate replaces the config's `!**/*.test.ts` negations, so
        #     test files are filtered out explicitly — otherwise Stryker would
        #     mutate the tests themselves.
        # FULL SCOPE is restored when `stryker.config.json` changes — the
        # mutate array and thresholds ARE the scope, so a narrowed run can't
        # validate an edit to them — or when the mapping yields nothing, so we
        # never silently narrow to zero.
        #
        # Deliberately NOT full-scope triggers, though both were in the first
        # draft of this step:
        #   • tsconfig.stryker.json — Stryker's TS checker compiles the whole
        #     `include` set no matter what --mutate selects, so a narrowed run
        #     already validates a tsconfig edit completely.
        #   • this workflow — forcing full scope here would mean the narrowing
        #     path never executes on the PR that changes it, which is exactly
        #     backwards. A narrowed run exercises the new logic end to end.
        #
        # THRESHOLDS: a narrowed run also drops `thresholds.break` to 0 (see
        # the run step). 22 was calibrated against the AGGREGATE score of the
        # whole scope, where weak files hide behind strong ones — applying it
        # to a single file invents a far stricter, per-file gate as a side
        # effect of a speed change. Measured against the 2026-07-22 nightly,
        # three files in the scope would fail it on pre-existing debt:
        # generatePrompt.ts (0%, 270 of 343 mutants uncovered), getStateData.ts
        # (13%) and prompts/research-candidate-structured.ts (0%). Enforcement
        # is therefore unchanged from today: the nightly full run still gates
        # the aggregate at 22, and narrowed PR runs still fail on compile
        # errors, test failures and Stryker errors — they just don't invent a
        # score gate that never existed.
        if: github.event_name == 'pull_request' && steps.decide.outputs.should_run == 'true'
        env:
          CHANGED: ${{ steps.filter.outputs.scoped_files }}
        run: |
          set -uo pipefail
          full=""
          targets=""
          for f in $CHANGED; do
            case "$f" in
              stryker.config.json)
                full="yes"
                ;;
              tsconfig.stryker.json|.github/workflows/mutation.yml)
                ;;
              *.test.ts|*.test.tsx|*.spec.ts|*.spec.tsx)
                base="${f%.test.ts}"
                base="${base%.test.tsx}"
                base="${base%.spec.ts}"
                base="${base%.spec.tsx}"
                for ext in ts tsx; do
                  if [ -f "$base.$ext" ]; then
                    targets="$targets $base.$ext"
                  fi
                done
                ;;
              *.ts|*.tsx)
                targets="$targets $f"
                ;;
            esac
          done
          if [ -n "$targets" ]; then
            targets=$(printf '%s\n' $targets | sort -u | paste -sd, -)
          fi
          if [ -n "$full" ] || [ -z "$targets" ]; then
            echo "::notice::Mutating the full configured scope."
            echo "mutate=" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Mutating only this PR's changed files: $targets"
            echo "mutate=$targets" >> "$GITHUB_OUTPUT"
          fi

      - name: Note skip when Stryker did not run
        if: github.event_name == 'pull_request' && steps.decide.outputs.should_run == 'false'
        run: |
          echo "::notice::Stryker skipped. Mutation gate reports passed."
          if [ "${{ steps.filter.outputs.scoped }}" == "true" ]; then
            echo "Reason: scoped paths changed, but the actor is dependabot[bot] — a pinned-action version bump cannot affect a mutant."
          else
            echo "Reason: no scoped paths changed in this PR (see header comment); nightly runs mutate the full stryker.config.json scope."
          fi

      - name: Setup Node
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.decide.outputs.should_run == 'true'
        run: npm ci

      - name: Sync generated ballot prompt module
        # Stryker spawns Vitest programmatically and bypasses npm pre/post
        # hooks, so the `pretest` hook (which generates the ballot prompt
        # module imported by scoped tests) does not fire automatically.
        # Run it explicitly to avoid spurious import failures.
        if: steps.decide.outputs.should_run == 'true'
        run: npm run sync:ballot-prompt

      - name: Run Stryker mutation testing
        # `mutate` is empty on nightly/dispatch runs and on any PR that needs
        # the full scope, in which case Stryker falls back to stryker.config.json
        # verbatim — same command, same thresholds, as before this change.
        #
        # A narrowed run needs `thresholds.break: 0` for the reason documented
        # on the narrowing step. Stryker exposes no CLI flag for it, so the
        # config is copied with that one field overridden; everything else,
        # including the mutate array (which --mutate then supersedes), is
        # inherited so the two paths can't drift.
        if: steps.decide.outputs.should_run == 'true'
        env:
          MUTATE: ${{ steps.scope.outputs.mutate }}
        run: |
          set -euo pipefail
          if [ -n "$MUTATE" ]; then
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("stryker.config.json", "utf8"));
              cfg.thresholds = { ...cfg.thresholds, break: 0 };
              fs.writeFileSync("stryker.pr.config.json", JSON.stringify(cfg, null, 2));
            '
            npx stryker run stryker.pr.config.json --mutate "$MUTATE"
          else
            npx stryker run
          fi

      - name: Upload mutation report
        # Always upload — even on failure — so reviewers can inspect the
        # HTML report when the threshold gate trips. Only upload when
        # Stryker actually ran (i.e., not on a skipped PR).
        if: always() && steps.decide.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn
