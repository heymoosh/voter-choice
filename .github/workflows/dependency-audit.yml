name: Dependency Audit

# Class C dependency-scan loop (docs/maintenance.md / shared rubric): weekly,
# plus every PR/push so a newly-introduced high-severity dependency is caught
# before merge, not just on the weekly cadence.
#
# NOT yet added to branch protection's required status checks — that's an
# admin-only repo-settings action left to Muxin (same convention as other
# branch-protection edits in this org).
#
# The baseline IS clean as of 2026-07-20: the high-severity findings this
# workflow surfaced at introduction were fixed in the same PR — form-data CRLF
# injection (GHSA-hmw2-7cc7-3qxx) via `npm audit fix`, and playwright's missing
# SSL verification on browser download (GHSA-7mvr-c777-76hp) by moving
# @playwright/test 1.52.0 -> 1.61.1. `npm audit --omit=dev --audit-level=high`
# now exits 0, so this check is safe to make required whenever Muxin makes that
# repo-settings edit.
#
# Two moderate findings remain, deliberately: postcss <8.5.10
# (GHSA-qx2v-qp2m-jg93) is reachable only through next's bundled copy, and npm's
# only offered fix is a downgrade to next@9.3.3 — a multi-major breaking change
# to clear a moderate. Both sit below this gate's `high` threshold and clear
# when next ships a bumped postcss.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps, block on high/critical)
        run: npm audit --omit=dev --audit-level=high
