name: Component Overlap Review (advisory)

# ADVISORY ONLY — never a required check, never fails the PR. Companion to
# the two deterministic gates in test.yml:
#   - dup:check catches literal copy-paste,
#   - inventory:check forces a new component to declare its UI function,
#   - THIS job asks the judgment question neither can: does the new
#     component's function overlap an existing component's? (Muxin's
#     component-minimization ask, 2026-07-12 — parallel lanes have shipped
#     same-function components that then drifted out of sync.)
#
# Runs only when a PR ADDS a component file under src/prototype/redesign/.
# Skips silently (still green) when no ANTHROPIC_API_KEY secret is
# configured, so forks and secretless runs never block on it.

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/prototype/redesign/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlap-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Belt and braces: even an unexpected failure inside this job must not
    # turn the PR red — it is advisory by design.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Need the base ref locally to diff for ADDED files.
          fetch-depth: 0

      - name: Detect added component files
        id: added
        run: |
          ADDED=$(git diff --name-only --diff-filter=A \
            "origin/${{ github.base_ref }}...HEAD" -- \
            'src/prototype/redesign/*.tsx' \
            | grep -v '\.test\.tsx$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ADDED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$ADDED" ]; then
            echo "No new component files — nothing to review."
          fi

      - name: Check for API key
        id: key
        if: steps.added.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY secret not configured — advisory overlap review skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.added.outputs.files != '' && steps.key.outputs.configured == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Run overlap review
        if: steps.added.outputs.files != '' && steps.key.outputs.configured == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADDED_FILES: ${{ steps.added.outputs.files }}
        run: |
          {
            echo "You are reviewing a PR that adds new UI component file(s) to a React app."
            echo "The component inventory below lists every existing component and its UI function."
            echo "For EACH new component, judge: does its function overlap an existing component's"
            echo "(i.e. could an existing one have been extended with a prop/variant instead)?"
            echo "Be specific about which existing component overlaps and why, or say clearly that"
            echo "the new component is a genuinely distinct function. Keep it under 200 words total."
            echo "Output plain markdown for a PR comment. Do not run tools; judge from the text given."
            echo ""
            echo "## Inventory"
            cat scripts/quality/component-inventory.md
            echo ""
            echo "## New component file(s)"
            for f in $ADDED_FILES; do
              echo ""
              echo "### $f"
              echo '```tsx'
              head -c 20000 "$f"
              echo '```'
            done
          } > /tmp/overlap-prompt.md
          npx --yes @anthropic-ai/claude-code@latest -p "$(cat /tmp/overlap-prompt.md)" \
            > /tmp/overlap-review.md 2>/tmp/overlap-err.log || {
              echo "::notice::Overlap review failed to run (advisory — not failing the job)."
              cat /tmp/overlap-err.log
              exit 0
            }
          echo "Review generated:"
          cat /tmp/overlap-review.md

      - name: Post/update PR comment
        if: steps.added.outputs.files != '' && steps.key.outputs.configured == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- component-overlap-review-bot -->";
            let review = "";
            try {
              review = fs.readFileSync("/tmp/overlap-review.md", "utf8").trim();
            } catch {
              return; // review never ran — nothing to post
            }
            if (!review) return;
            const body = [
              marker,
              "**Component overlap review** (advisory — deterministic gates are `dup:check` + `inventory:check`)",
              "",
              review,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
