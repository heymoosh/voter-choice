name: Ingest Member Stats

on:
  # Monday 07:00 UTC — weekly refresh of attendance + term/geography facts
  schedule:
    - cron: "0 7 * * 1"
  # Allow manual trigger for the initial backfill / pre-cutover run
  workflow_dispatch:
    inputs:
      congress:
        description: "Override congress number (default: derived from current roles)."
        required: false
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Bitwarden Secrets Manager CLI
        # Pinned to bws-v2.0.0's published checksum:
        # https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-sha256-checksums-2.0.0.txt
        # On a deliberate version bump, update both the download URL and this hash together.
        run: |
          curl -sSLo bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-x86_64-unknown-linux-musl-2.0.0.zip"
          echo "ea6eb18f1270388f12d15a35f919ccb3488d32a777433baefe883d561f46fc73  bws.zip" | sha256sum -c -
          unzip -o bws.zip bws
          sudo install -m 755 bws /usr/local/bin/bws
          bws --version

      - name: Pull secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: |
          # ---------------------------------------------------------------
          # DATABASE_URL — Neon Postgres connection string
          # ---------------------------------------------------------------
          DATABASE_URL=$(bws secret get 90abeeed-130e-4707-86ff-b446003770c2 --access-token "$BWS_ACCESS_TOKEN" --output json | jq -r '.value')
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "::add-mask::$DATABASE_URL"

      - name: Validate manual inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          CONGRESS: ${{ inputs.congress }}
        run: |
          if [ -n "$CONGRESS" ] && ! [[ "$CONGRESS" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid congress input '$CONGRESS' — must be numeric (^[0-9]+$)."
            exit 1
          fi

      - name: Run member stats ingest
        env:
          CONGRESS: ${{ inputs.congress }}
        run: |
          if [ -n "$CONGRESS" ]; then
            npx tsx scripts/ingest/member-stats.ts --congress "$CONGRESS"
          else
            npx tsx scripts/ingest/member-stats.ts
          fi
